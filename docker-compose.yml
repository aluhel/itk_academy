services:
  postgres:
    image: postgres:16
    container_name: itk-postgres
    environment:
      POSTGRES_USER: itk
      POSTGRES_PASSWORD: itk
      POSTGRES_DB: itk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itk -d itk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: